name: NexusTerra
version: 0.1.26
main: com.nexusuniverse.terra.NexusTerraPlugin
api-version: '1.21'
author: Nexus Universe
description: Generates real-world terrain and structures from live geographic data.
commands:
  nexusterra:
    description: NexusTerra terrain generation.
    aliases: [terra]
    usage: /nexusterra generate <lat> <lon> [radiusMeters]  |  /nexusterra expand <lat> <lon> [tileRadiusMeters]  |  /nexusterra stop
    permission: nexusterra.use
permissions:
  nexusterra.use:
    description: Generate real-world terrain.
    default: op
